<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusStop</title>

    <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .console-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      padding: 16px;
      border-radius: 8px;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body class="py-5">
  <div class="container" style="max-width: 680px;">
    
    <!-- 버스 정보 조회 카드 -->
    <div class="card-box mb-4">
      <h4 class="fw-bold mb-1">🚌 실시간 버스 도착 정보</h4>
      <p class="text-muted small mb-3">
        fetch()와 서울시 공공데이터 API를 활용해 실시간 버스 도착 정보를 조회합니다.
      </p>

      <!-- 셀렉트 상자를 제외하고 조회 버튼을 너비 전체(w-100)로 배치 -->
      <div class="mb-3">
        <button id="btnFetch" class="btn btn-primary fw-bold w-100 py-2">
          실시간 버스 도착 정보 조회하기
        </button>
      </div>

      <!-- 버스 정보 결과 카드 -->
      <div id="resultCard" class="p-3 bg-light rounded text-center d-none">
        <div class="text-muted small" id="cityName">-</div>
        <h2 class="fw-bold text-primary my-2" id="cityTemp">-</h2>
        <div class="small text-secondary" id="cityExtra">-</div>
      </div>
    </div>

    <!-- 실행 로그 창 -->
    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold small text-dark">📜 실행 로그</span>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">초기화</button>
      </div>
      <div class="console-box" id="logBox">> 버튼을 누르면 fetch()가 실행됩니다.</div>
    </div>

  </div>

  <script src="bus.js"></script>

   <select id="citySelect" class="form-select" style="max-width: 240px;">
        <option value="seoul_station">서울역버스환승센터(중)</option>
        <option value="sehyun_church">시립서북병원.세현교회앞 (12217)</option>
        <option value="yeonsinnae_4">연신내역 4번출구 (12119)</option>
        <option value="yeonsinnae_3">연신내역 3번출구 (12106)</option>
        <option value="yeonso_market">연신내역.연서시장(중) (12018)</option>
    </select>
</body>
</html>
