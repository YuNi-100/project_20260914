<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WE GO HIGH! - 풋살의 모든 것</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased selection:bg-lime-400 selection:text-slate-900">

  <!-- Navigation -->
  <nav class="flex items-center justify-between px-6 py-4 border-b border-slate-800 backdrop-blur-md fixed top-0 w-full z-50 bg-slate-950/80">
    <div class="flex items-center gap-2">
      <div class="bg-lime-400 text-slate-950 p-2 rounded-lg font-black tracking-wider text-xl">
        FS
      </div>
      <span class="text-xl font-bold tracking-tight">VIBE<span class="text-lime-400">FUTSAL</span></span>
    </div>
    <div class="hidden md:flex items-center gap-8 text-sm text-slate-400 font-medium">
      <a href="#" class="hover:text-lime-400 transition-colors">매치 찾기</a>
      <a href="#" class="hover:text-lime-400 transition-colors">구장 예약</a>
      <a href="#" class="hover:text-lime-400 transition-colors">팀 랭킹</a>
      <a href="#" class="hover:text-lime-400 transition-colors">커뮤니티</a>
    </div>
    <div class="flex items-center gap-3">
      <button class="text-sm font-semibold px-4 py-2 text-slate-300 hover:text-white transition-colors">로그인</button>
      <button class="text-sm font-bold px-4 py-2 bg-lime-400 text-slate-950 rounded-full hover:bg-lime-300 transition-all transform hover:scale-105">
        빠른 시작
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="relative pt-32 pb-20 md:pt-48 md:pb-32 overflow-hidden min-h-screen flex items-center justify-center">
    <!-- Background Glow Effect -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-lime-500/10 rounded-full blur-[120px] -z-10"></div>
    <div class="absolute top-1/3 right-10 w-[300px] h-[300px] bg-emerald-500/10 rounded-full blur-[100px] -z-10"></div>

    <div class="max-w-5xl mx-auto px-6 text-center">
      <!-- Badge -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-lime-400/30 bg-lime-400/10 text-lime-400 text-xs font-semibold mb-8 backdrop-blur-md">
        <i data-lucide="zap" class="w-3.5 h-3.5"></i>
        <span>실시간 매칭 시스템 OPEN</span>
      </div>

      <!-- Main Heading -->
      <h1 class="text-4xl md:text-7xl font-black tracking-tight leading-tight mb-6">
        오늘 경기할 <span class="text-transparent bg-clip-text bg-gradient-to-r from-lime-400 to-emerald-400">풋살팀</span>을<br class="hidden sm:inline" /> 
        가장 빠르게 찾아보세요.
      </h1>

      <!-- Subtitle -->
      <p class="text-base md:text-xl text-slate-400 max-w-2xl mx-auto mb-10 leading-relaxed">
        혼자여도 괜찮아요. 내 실력에 딱 맞는 소셜 매치부터 구장 예약까지, 
        지금 바로 원하는 타임에 참여해보세요.
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16">
        <button class="w-full sm:w-auto px-8 py-4 bg-lime-400 text-slate-950 font-extrabold rounded-2xl hover:bg-lime-300 transition-all shadow-lg shadow-lime-400/20 text-lg flex items-center justify-center gap-2 group">
          <span>소셜 매치 참가하기</span>
          <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
        </button>
        <button class="w-full sm:w-auto px-8 py-4 bg-slate-900 border border-slate-800 font-bold rounded-2xl hover:bg-slate-800 hover:border-slate-700 transition-all text-lg text-slate-200">
          구장 둘러보기
        </button>
      </div>

      <!-- Quick Search / Stats Card -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto p-4 bg-slate-900/60 border border-slate-800/80 rounded-2xl backdrop-blur-xl">
        <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/40">
          <div class="text-lime-400 text-2xl font-black mb-1">1,240+</div>
          <div class="text-xs text-slate-400 font-medium">이번 주 진행 매치</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/40">
          <div class="text-lime-400 text-2xl font-black mb-1">98%</div>
          <div class="text-xs text-slate-400 font-medium">매칭 성사율</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/40">
          <div class="text-lime-400 text-2xl font-black mb-1">350+</div>
          <div class="text-xs text-slate-400 font-medium">제휴 풋살장</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-950/40 border border-slate-800/40">
          <div class="text-lime-400 text-2xl font-black mb-1">4.9 / 5.0</div>
          <div class="text-xs text-slate-400 font-medium">참가자 매너 온도</div>
        </div>
      </div>

    </div>
  </main>

  <!-- Lucide Icons Script Initialize -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
